apiVersion: apps/v1
kind: Deployment
metadata:
  name: altsetter-api
  namespace: altsetter
  labels:
    app.kubernetes.io/name: altsetter-api
    app.kubernetes.io/part-of: altsetter
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: altsetter-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: altsetter-api
        app.kubernetes.io/part-of: altsetter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/adrian-rostin/altsetter-api
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            # Alle Zugangsdaten aus dem Secret altsetter-db. Die API nutzt die Rolle, die nur lesen darf.
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: altsetter-db
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: altsetter-db
                  key: api-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: altsetter-db
                  key: api-password
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 50m
              memory: 320Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
