# Migrationen einspielen, dann beenden (tools/migrate.sh). Nur nötig, wenn eine neue Migration
# dazukommt; mit der Eigentümer-Rolle statt der Leserolle der API (Zugang aus dem Secret).
spring:
  main:
    web-application-type: none
  flyway:
    enabled: true
  datasource:
    hikari:
      maximum-pool-size: 2
      data-source-properties:
        # Migrationen dürfen länger dauern als eine Abfrage der API.
        options: "-c statement_timeout=60000"
  jpa:
    properties:
      jakarta:
        persistence:
          query:
            timeout: 60000
